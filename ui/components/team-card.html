<!--
  TEAM CARD — Reusable Component
  ────────────────────────────────
  Single team member / partner card with avatar, name, role,
  location, bio, skill badges, and social links.
  Hover: lift + gradient glow overlay + avatar scale.

  TO CUSTOMIZE:
  - Change --tc-accent for brand color
  - Change --tc-bg for inner card background (match your page)
  - Swap avatar src, name, role, location, bio, skills, socials
  - Uses inline SVGs for social icons — swap as needed
-->

<style>
  .tc {
    --tc-accent: #F25B19;
    --tc-bg: rgba(255,255,255,0.02);

    position: relative;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.06);
    background: var(--tc-bg);
    backdrop-filter: blur(8px);
    padding: 28px 20px;
    text-align: center;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
    overflow: hidden;
    max-width: 420px;
  }

  .tc:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.3);
  }

  .tc-glow {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, color-mix(in srgb, var(--tc-accent) 8%, transparent), transparent);
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }

  .tc:hover .tc-glow { opacity: 1; }

  .tc-avatar-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 14px;
  }

  .tc-avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.03);
    padding: 3px;
    overflow: hidden;
    transition: transform 0.3s ease;
  }

  .tc:hover .tc-avatar { transform: scale(1.05); }

  .tc-avatar img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }

  .tc-name {
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }

  .tc-role {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 50px;
    background: color-mix(in srgb, var(--tc-accent) 10%, transparent);
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--tc-accent);
    margin-bottom: 8px;
  }

  .tc-location {
    font-size: 12px;
    color: rgba(255,255,255,0.35);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .tc-location svg { width: 12px; height: 12px; }

  .tc-bio {
    font-size: 14px;
    color: rgba(255,255,255,0.45);
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .tc-skills {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-bottom: 16px;
  }

  .tc-skill {
    padding: 4px 10px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.02);
    font-size: 10px;
    color: rgba(255,255,255,0.45);
  }

  .tc-socials {
    display: flex;
    justify-content: center;
    gap: 8px;
  }

  .tc-social {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.02);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.35);
    text-decoration: none;
    transition: color 0.2s, background 0.2s;
  }

  .tc-social:hover {
    color: var(--tc-accent);
    background: color-mix(in srgb, var(--tc-accent) 8%, transparent);
  }

  .tc-social svg { width: 13px; height: 13px; }
</style>

<!-- ─── MARKUP ──────────────────────────────────────────── -->

  Copy one .tc div per team member. Swap content as needed.

-->

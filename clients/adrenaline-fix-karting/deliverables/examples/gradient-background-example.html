<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Background — AFK Example</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Saira:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Saira', sans-serif;
      background: #111;
    }

    /* ─── Animated CSS Properties (enables gradient interpolation) ── */
    @property --gb-c1 {
      syntax: '<color>';
      initial-value: #1a0a00;
      inherits: false;
    }
    @property --gb-c2 {
      syntax: '<color>';
      initial-value: #F25B19;
      inherits: false;
    }
    @property --gb-c3 {
      syntax: '<color>';
      initial-value: #111111;
      inherits: false;
    }
    @property --gb-angle {
      syntax: '<angle>';
      initial-value: 135deg;
      inherits: false;
    }

    /* ─── Gradient Background Component ─────────────────── */
    .gb {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
    }

    .gb-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: linear-gradient(var(--gb-angle), var(--gb-c1) 0%, var(--gb-c2) 50%, var(--gb-c3) 100%);
      animation: gb-flow 16s ease-in-out infinite;
    }

    @keyframes gb-flow {
      0% {
        --gb-c1: #1a0a00;
        --gb-c2: #F25B19;
        --gb-c3: #111111;
        --gb-angle: 135deg;
      }
      20% {
        --gb-c1: #0d0d0d;
        --gb-c2: #8B3A0F;
        --gb-c3: #1a0800;
        --gb-angle: 180deg;
      }
      40% {
        --gb-c1: #F25B19;
        --gb-c2: #111111;
        --gb-c3: #2a1000;
        --gb-angle: 225deg;
      }
      60% {
        --gb-c1: #1a0800;
        --gb-c2: #d44f15;
        --gb-c3: #0d0d0d;
        --gb-angle: 270deg;
      }
      80% {
        --gb-c1: #0d0d0d;
        --gb-c2: #F25B19;
        --gb-c3: #1a0a00;
        --gb-angle: 315deg;
      }
      100% {
        --gb-c1: #1a0a00;
        --gb-c2: #F25B19;
        --gb-c3: #111111;
        --gb-angle: 135deg;
      }
    }

    .gb-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .gb-content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* ─── AFK Hero Content ──────────────────────────────── */
    .afk-hero {
      text-align: center;
      color: #fff;
      max-width: 800px;
    }

    .afk-eyebrow {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      margin-bottom: 24px;
    }

    .afk-h1 {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(40px, 7vw, 80px);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      text-shadow: 0 2px 40px rgba(0,0,0,0.3);
    }

    .afk-sub {
      font-size: 18px;
      line-height: 1.6;
      color: rgba(255,255,255,0.8);
      max-width: 560px;
      margin: 0 auto 40px;
    }

    .afk-ctas {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .afk-btn {
      display: inline-block;
      padding: 16px 36px;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .afk-btn-primary {
      background: #fff;
      color: #111;
      border-color: #fff;
    }

    .afk-btn-primary:hover {
      background: transparent;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .afk-btn-ghost {
      background: transparent;
      color: #fff;
      border-color: rgba(255,255,255,0.4);
    }

    .afk-btn-ghost:hover {
      border-color: #fff;
      transform: translateY(-2px);
    }

    /* Stat strip */
    .afk-stats {
      display: flex;
      justify-content: center;
      gap: 48px;
      margin-top: 64px;
      padding-top: 32px;
      border-top: 1px solid rgba(255,255,255,0.15);
      flex-wrap: wrap;
    }

    .afk-stat-val {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    .afk-stat-label {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }

    /* Noise texture overlay */
    .gb::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
    }

    @media (max-width: 768px) {
      .afk-stats {
        gap: 32px;
      }
    }
  </style>
</head>
<body>

  <section class="gb">
    <div class="gb-bg" id="gb-bg"></div>
    <div class="gb-overlay" style="background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.4) 100%);"></div>

    <div class="gb-content">
      <div class="afk-hero">

        <p class="afk-eyebrow">Columbus, Ohio &nbsp;·&nbsp; Est. 2007</p>

        <h1 class="afk-h1">Your Next Race<br>Starts Here.</h1>

        <p class="afk-sub">
          Full-service kart racing team. We build it, prep it, haul it, crew it, and coach you.
          You show up. You race. We handle the rest.
        </p>

        <div class="afk-ctas">
          <a href="#" class="afk-btn afk-btn-primary">Book Arrive &amp; Drive</a>
          <a href="tel:6143705152" class="afk-btn afk-btn-ghost">Call 614-370-5152</a>
        </div>

        <div class="afk-stats">
          <div>
            <div class="afk-stat-val">19</div>
            <div class="afk-stat-label">Years Racing</div>
          </div>
          <div>
            <div class="afk-stat-val">NCMP</div>
            <div class="afk-stat-label">Every Weekend</div>
          </div>
          <div>
            <div class="afk-stat-val">LO206</div>
            <div class="afk-stat-label">Class Specialist</div>
          </div>
          <div>
            <div class="afk-stat-val">100%</div>
            <div class="afk-stat-label">In-House</div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- No JS needed — CSS @property handles smooth gradient interpolation -->

</body>
</html>

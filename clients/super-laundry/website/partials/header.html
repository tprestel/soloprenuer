<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green-dark: #1C4A25;
    --green: #2D7F3C;
    --green-light: #4A9B58;
  }
  a { text-decoration: none; }

  /* ===== AWARD BAR ===== */
  .award-bar {
    background: #B5D300;
    padding: 9px 24px;
    text-align: center;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .award-bar p {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #1C4A25;
  }
  .award-bar span { color: #1C4A25; font-weight: 700; }
  .award-bar .dot { margin: 0 10px; opacity: 0.75; color: #1C4A25; font-size: 16px; vertical-align: middle; }

  /* ===== NAVIGATION ===== */
  nav {
    background: var(--green-dark);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 68px;
    max-width: 1160px;
    margin: 0 auto;
  }
  .nav-logo img {
    height: 44px;
    width: auto;
    mix-blend-mode: screen;
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 32px;
    list-style: none;
  }
  .nav-links a {
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.82);
    letter-spacing: 0.02em;
    transition: color 0.2s;
  }
  .nav-links a:hover,
  .nav-links a.active { color: #fff; }
  .nav-links a.active { font-weight: 700; }
  .nav-cta {
    background: var(--green) !important;
    color: #fff !important;
    padding: 10px 20px !important;
    border-radius: 6px !important;
    font-weight: 600 !important;
    transition: background 0.2s !important;
  }
  .nav-cta:hover { background: var(--green-light) !important; }
  .nav-hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
  }
  .nav-hamburger span {
    display: block;
    width: 24px;
    height: 2px;
    background: rgba(255,255,255,0.85);
    border-radius: 2px;
  }
  .nav-mobile-menu {
    display: none;
    background: var(--green-dark);
    border-top: 1px solid rgba(255,255,255,0.1);
    padding: 16px 24px 24px;
  }
  .nav-mobile-menu.open { display: block; }
  .nav-mobile-menu a {
    display: block;
    padding: 12px 0;
    font-size: 15px;
    font-weight: 500;
    color: rgba(255,255,255,0.82);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .nav-mobile-menu a:last-child { border-bottom: none; }
  .nav-mobile-menu a:hover,
  .nav-mobile-menu a.active { color: #fff; }

  @media (max-width: 640px) {
    .nav-links { display: none; }
    .nav-hamburger { display: flex; }
  }
</style>

<!-- AWARD BAR -->
<div class="award-bar">
  <p>
    <span>Best Laundromat in Cincinnati</span>
    <span class="dot">·</span>
    BusinessRate Best of 2025
    <span class="dot">·</span>
    Based on verified Google Reviews
  </p>
</div>

<!-- NAVIGATION -->
<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <img src="/hubfs/244988351/logos/superlaundry%20logo.png" alt="Super Laundry Cincinnati">
    </a>
    <ul class="nav-links">
      <li><a href="/services">Services</a></li>
      <li><a href="/about">About</a></li>
      <li><a href="/partner">Partner</a></li>
      <li><a href="/contact">Contact</a></li>
      <li><a href="/careers">We're Hiring</a></li>
      <li><a href="/locations" class="nav-cta">Find a Location</a></li>
    </ul>
    <button class="nav-hamburger" aria-label="Open menu" onclick="document.getElementById('mobileMenu').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="nav-mobile-menu" id="mobileMenu">
    <a href="/services">Services</a>
    <a href="/about">About</a>
    <a href="/partner">Partner</a>
    <a href="/contact">Contact</a>
    <a href="/careers">We're Hiring</a>
    <a href="/locations">Find a Location</a>
  </div>
</nav>

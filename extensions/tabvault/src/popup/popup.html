<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="header">
      <h1>TabVault</h1>
    </div>

    <button id="save-btn" class="btn-primary">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 1v10M4 7l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 13h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Save All Tabs
    </button>

    <div id="status" class="status hidden"></div>

    <div class="info">
      <span id="group-count">0 tab groups saved</span>
    </div>

    <button id="open-vault" class="btn-link">Open TabVault</button>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>

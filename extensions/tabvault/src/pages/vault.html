<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabSafe</title>
  <link rel="stylesheet" href="vault.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-left">
        <h1>TabSafe</h1>
        <label class="premium-toggle" title="Toggle premium mode (dev)">
          <input type="checkbox" id="premium-toggle">
          <span class="premium-toggle-label">PRO</span>
        </label>
      </div>
      <div class="header-actions">
        <button id="settings-btn" class="btn btn-secondary" title="Settings">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="8" r="2.5"/>
            <path d="M13.5 8a5.5 5.5 0 01-.3 1.8l1.3.8-.9 1.5-1.3-.7a5.5 5.5 0 01-1.5 1l.1 1.5h-1.8l.1-1.5a5.5 5.5 0 01-1.5-1l-1.3.7-.9-1.5 1.3-.8A5.5 5.5 0 012.5 8a5.5 5.5 0 01.3-1.8L1.5 5.4l.9-1.5 1.3.7a5.5 5.5 0 011.5-1L5.1 2.1h1.8l-.1 1.5a5.5 5.5 0 011.5 1l1.3-.7.9 1.5-1.3.8a5.5 5.5 0 01.3 1.8z"/>
          </svg>
        </button>
        <div class="dropdown">
          <button id="export-btn" class="btn btn-secondary">Export</button>
          <div id="export-menu" class="dropdown-menu hidden">
            <button data-format="json">Export as JSON</button>
            <button data-format="markdown">Export as Markdown</button>
            <button data-format="html">Export as HTML</button>
          </div>
        </div>
        <label class="btn btn-secondary import-label">
          Import
          <input type="file" id="import-input" accept=".json,.txt,.text" hidden>
        </label>
      </div>
    </header>

    <!-- Settings Panel -->
    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-section">
        <h3>Settings</h3>
        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">Auto-delete old groups</span>
            <span class="pro-badge" id="cleanup-pro-badge">PRO</span>
          </div>
          <select id="cleanup-select" class="setting-select">
            <option value="0">Off</option>
            <option value="7">7 days</option>
            <option value="14">14 days</option>
            <option value="30">30 days</option>
            <option value="60">60 days</option>
            <option value="90">90 days</option>
          </select>
        </div>
        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">Auto-save on browser close</span>
            <span class="pro-badge" id="autosave-pro-badge">PRO</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="autosave-toggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- Sort Bar -->
    <div id="sort-bar" class="sort-bar">
      <span class="sort-label">Sort:</span>
      <button class="sort-btn active" data-sort="newest">Newest</button>
      <button class="sort-btn" data-sort="oldest">Oldest</button>
      <button class="sort-btn" data-sort="tabs">Most tabs</button>
    </div>

    <!-- Color Sort Bar (Premium) -->
    <div id="color-sort-bar" class="color-sort-bar hidden">
      <span class="color-sort-label">Filter by color:</span>
      <button class="color-filter-btn active" data-filter="all" title="All groups">All</button>
      <button class="color-filter-btn" data-filter="red" title="Red"><span class="filter-dot" style="background:#EF4444"></span></button>
      <button class="color-filter-btn" data-filter="orange" title="Orange"><span class="filter-dot" style="background:#F97316"></span></button>
      <button class="color-filter-btn" data-filter="yellow" title="Yellow"><span class="filter-dot" style="background:#EAB308"></span></button>
      <button class="color-filter-btn" data-filter="green" title="Green"><span class="filter-dot" style="background:#22C55E"></span></button>
      <button class="color-filter-btn" data-filter="blue" title="Blue"><span class="filter-dot" style="background:#3B82F6"></span></button>
      <button class="color-filter-btn" data-filter="purple" title="Purple"><span class="filter-dot" style="background:#8B5CF6"></span></button>
      <button class="color-filter-btn" data-filter="gray" title="Gray"><span class="filter-dot" style="background:#6B7280"></span></button>
      <button class="color-filter-btn" data-filter="none" title="No color">—</button>
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round">
        <circle cx="6.5" cy="6.5" r="5"/>
        <path d="M10.5 10.5L14.5 14.5"/>
      </svg>
      <input type="text" id="search-input" class="search-input" placeholder="Search tab groups..." autocomplete="off">
      <button id="search-clear" class="search-clear hidden" title="Clear search">&times;</button>
      <div id="search-pro-overlay" class="search-pro-overlay hidden">
        <span class="pro-badge">PRO</span>
        <span>Upgrade to search across all your tab groups</span>
      </div>
    </div>

    <div id="no-results" class="no-results hidden">
      <p>No matching tab groups found.</p>
    </div>

    <div id="empty-state" class="empty-state hidden">
      <p>No saved tab groups yet.</p>
      <p class="subtle">Click the TabSafe icon or press <kbd>Alt+Shift+T</kbd> to save your open tabs.</p>
    </div>

    <div id="groups-list" class="groups-list"></div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="vault.js" type="module"></script>
</body>
</html>

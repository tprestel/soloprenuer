<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="newtab.css">
  <title>New Tab</title>
</head>
<body>
  <!-- Sidebar (notebooks) -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Notebooks</span>
      <button id="btn-toggle-sidebar" class="icon-btn sidebar-close" title="Close sidebar" aria-label="Close sidebar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M11 4L5 8l6 4"/>
        </svg>
      </button>
    </div>

    <!-- Search -->
    <div class="sidebar-search">
      <div class="search-input-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="7" cy="7" r="4.5"/>
          <path d="M10.5 10.5L14 14"/>
        </svg>
        <input id="search-input" type="text" placeholder="Search notebooks..." class="search-input">
        <span id="search-pro-badge" class="pro-badge hidden">PRO</span>
      </div>
      <div id="search-results" class="search-results hidden"></div>
    </div>

    <div id="notebook-list" class="notebook-list"></div>

    <button id="btn-new-notebook" class="btn-new-notebook">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M8 3v10M3 8h10"/>
      </svg>
      New Notebook
      <span id="new-nb-pro-badge" class="pro-badge hidden">PRO</span>
    </button>
  </aside>

  <!-- Main content area -->
  <div id="main-area" class="main-area">
    <div class="editor-wrap">
      <div
        id="editor"
        contenteditable="true"
        spellcheck="true"
        data-placeholder="Start typing..."
      ></div>
      <div id="markdown-preview" class="markdown-preview hidden"></div>
      <div id="writing-goal-bar" class="writing-goal-bar hidden">
        <div id="writing-goal-progress" class="writing-goal-progress"></div>
        <span id="writing-goal-label" class="writing-goal-label">0 / 500 words</span>
      </div>
    </div>

    <footer class="status-bar">
      <div class="status-left">
        <button id="btn-open-sidebar" class="icon-btn" title="Open sidebar" aria-label="Open sidebar">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M2 4h12M2 8h12M2 12h12"/>
          </svg>
        </button>
        <span id="save-status">Ready</span>
      </div>
      <div class="status-right">
        <span id="word-count" class="word-count-toggle" title="Click to toggle character count">0 words</span>
        <span id="read-time" class="read-time">· ~0m read</span>

        <!-- Typewriter mode -->
        <button id="btn-typewriter" class="icon-btn typewriter-btn" title="Typewriter mode" aria-label="Typewriter mode">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="4" width="12" height="8" rx="1"/>
            <path d="M5 10h6M8 7v3"/>
          </svg>
        </button>

        <!-- Focus mode -->
        <button id="btn-focus" class="icon-btn focus-btn" title="Focus mode (hides sidebar &amp; toolbar)" aria-label="Focus mode">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M1 4V2h3M12 2h3v2M1 12v2h3M12 14h3v-2"/>
          </svg>
        </button>

        <!-- Focus paragraph mode -->
        <button id="btn-focus-para" class="icon-btn focus-para-btn" title="Focus paragraph mode" aria-label="Focus paragraph mode">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M2 5h12M2 8h8M2 11h10" opacity="0.3"/>
            <path d="M2 8h12"/>
          </svg>
        </button>
        <span id="focus-para-pro-badge" class="pro-badge hidden">PRO</span>

        <!-- Version history -->
        <button id="btn-history" class="icon-btn history-btn" title="Version history" aria-label="Version history">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M1 8a7 7 0 1 0 7-7"/>
            <path d="M1 1v4h4"/>
            <path d="M8 5v3l2 2"/>
          </svg>
          <span id="history-pro-badge" class="pro-badge hidden">PRO</span>
        </button>

        <!-- Markdown toggle -->
        <button id="btn-md-toggle" class="icon-btn md-toggle-btn" title="Toggle Markdown Preview" aria-label="Toggle Markdown Preview">
          <span class="md-toggle-label">Preview</span>
          <span id="md-pro-badge" class="pro-badge hidden">PRO</span>
        </button>

        <button id="btn-import" class="icon-btn" title="Import note" aria-label="Import note">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M8 10V2M5 5l3-3 3 3M3 12h10"/>
          </svg>
        </button>
        <div class="export-dropdown" id="export-dropdown">
          <button id="btn-export" class="icon-btn" title="Export note" aria-label="Export note">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M8 2v8M5 7l3 3 3-3M3 12h10"/>
            </svg>
          </button>
          <div class="dropdown-menu hidden" id="export-menu">
            <button id="export-txt" class="dropdown-item">Export as .txt</button>
            <button id="export-md" class="dropdown-item">Export as .md</button>
          </div>
        </div>
        <input type="file" id="import-file" accept=".txt,.md,.markdown" style="display: none;">
        <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M6.7 2.5h2.6l.4 1.6.9.5 1.5-.6 1.8 1.8-.6 1.5.5.9 1.6.4v2.6l-1.6.4-.5.9.6 1.5-1.8 1.8-1.5-.6-.9.5-.4 1.6H6.7l-.4-1.6-.9-.5-1.5.6-1.8-1.8.6-1.5-.5-.9-1.6-.4V6.7l1.6-.4.5-.9-.6-1.5 1.8-1.8 1.5.6.9-.5z"/>
            <circle cx="8" cy="8" r="2"/>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Settings panel (hidden by default) -->
  <div id="settings-panel" class="settings-panel hidden">
    <h2>Settings</h2>
    <div class="setting-row">
      <label for="setting-font">Font</label>
      <select id="setting-font">
        <option value="Georgia">Georgia</option>
        <option value="'Times New Roman', serif">Times New Roman</option>
        <option value="system-ui, sans-serif">System UI</option>
        <option value="'Courier New', monospace">Courier New</option>
        <option value="'Charter', Georgia, serif">Charter</option>
      </select>
    </div>
    <div class="setting-row">
      <label for="setting-size">Size</label>
      <input id="setting-size" type="range" min="14" max="28" step="1" value="18">
      <span id="setting-size-value">18px</span>
    </div>
    <div class="setting-row">
      <label for="setting-theme">Theme</label>
      <select id="setting-theme">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="sepia">Sepia</option>
        <option value="custom">Custom</option>
      </select>
      <span id="theme-pro-badge" class="pro-badge hidden">PRO</span>
    </div>

    <!-- Custom theme color pickers (hidden by default) -->
    <div id="custom-theme-options" class="custom-theme-options hidden">
      <div class="setting-row">
        <label for="custom-bg">Background</label>
        <input id="custom-bg" type="color" value="#ffffff">
      </div>
      <div class="setting-row">
        <label for="custom-text">Text</label>
        <input id="custom-text" type="color" value="#1a1a1a">
      </div>
      <div class="setting-row">
        <label for="custom-accent">Accent</label>
        <input id="custom-accent" type="color" value="#4a90d9">
      </div>
    </div>

    <div class="setting-divider"></div>

    <div class="setting-row">
      <label for="setting-premium">Premium</label>
      <label class="toggle-switch">
        <input id="setting-premium" type="checkbox">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <p class="setting-hint">Toggle premium features (ExtensionPay integration coming soon)</p>

    <div class="setting-divider"></div>

    <div class="setting-row" id="writing-goal-row">
      <label for="setting-goal">Daily word goal</label>
      <div class="goal-input-wrap">
        <input id="setting-goal" type="number" min="0" max="50000" step="50" value="0" class="goal-input">
        <span class="goal-unit">words</span>
        <span id="goal-pro-badge" class="pro-badge hidden">PRO</span>
      </div>
    </div>

    <div class="setting-divider"></div>
    <div class="setting-row">
      <div>
        <span class="setting-label">Google Keep sync</span>
        <p class="setting-hint">Import and sync notes with Google Keep</p>
      </div>
      <button id="btn-keep-sync" class="btn-keep-sync">Connect</button>
    </div>

    <button id="btn-close-settings" class="btn-close">Done</button>
  </div>

  <!-- Version history panel -->
  <div id="history-panel" class="history-panel hidden">
    <div class="history-header">
      <h3>Version History</h3>
      <button id="btn-close-history" class="icon-btn">×</button>
    </div>
    <div id="history-list" class="history-list"></div>
  </div>

  <script type="module" src="newtab.js"></script>
</body>
</html>
